<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vt-life-title vt-life-desc">
    <title id="vt-life-title">The life of a key-value v2 secret version in @hapic/vault</title>
    <desc id="vt-life-desc">create, save and update write a new version, which is readable: getOne returns its data. delete soft deletes the latest version and deleteVersions soft deletes the given versions: reads answer 404, deletion_time is set and the data is kept. undeleteVersions makes a soft deleted version readable again. destroyVersions removes the data of readable or soft deleted versions permanently; the metadata stays and is marked destroyed, and it cannot be undone. deleteMetadata removes the metadata and every version of the secret, whatever their state, and cannot be undone either.</desc>

    <style>
        :root {
            --fg: #1F2335;
            --muted: #5B6078;
            --panel: #F6F7FB;
            --panel-edge: #D5D8E6;
            --card: #FFFFFF;
            --rail: #8A8FA8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #EEF0FA;
                --muted: #A0A6BE;
                --panel: #161827;
                --panel-edge: #3A3E55;
                --card: #0E1020;
                --rail: #6E7390;
            }
        }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
        .muted { fill: var(--muted); }
        .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
        .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
        .title { font-size: 15px; font-weight: 600; }
        .panel { fill: var(--panel); stroke: var(--panel-edge); }
        .card { fill: var(--card); }
        .chip { fill: var(--card); stroke: var(--panel-edge); }
    </style>

    <defs>
        <marker id="vt-life-keep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/>
        </marker>
        <marker id="vt-life-drop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#d946ef"/>
        </marker>
    </defs>

    <rect class="panel" x="16" y="16" width="928" height="388" rx="18"/>

    <!-- entry: a write -->
    <rect class="chip" x="40" y="36" width="200" height="32" rx="16" stroke="#6366f1"/>
    <text class="code" x="140" y="57" font-size="12" text-anchor="middle">create · save · update</text>
    <path d="M140 68 V148" stroke="#6366f1" stroke-width="2" marker-end="url(#vt-life-keep)"/>

    <!-- destroy from readable: an arc above the cards -->
    <path d="M220 152 V110 Q220 96 234 96 H806 Q820 96 820 110 V148" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>
    <rect class="chip" x="420" y="84" width="120" height="24" rx="12"/>
    <text class="code" x="480" y="100" font-size="11" text-anchor="middle">destroyVersions</text>

    <!-- state: readable -->
    <rect class="card" x="40" y="152" width="200" height="120" rx="12" stroke="#6366f1" stroke-width="1.5"/>
    <text class="title" x="58" y="178">Version N, readable</text>
    <text class="code" x="58" y="202" font-size="12">getOne → data</text>
    <text class="code muted" x="58" y="222" font-size="12">deletion_time: ""</text>
    <text class="muted" x="58" y="246" font-size="12">A write adds version N+1;</text>
    <text class="muted" x="58" y="262" font-size="12">N stays readable.</text>

    <!-- soft delete -->
    <path d="M240 186 H376" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>
    <rect class="chip" x="252" y="164" width="112" height="44" rx="12"/>
    <text class="code" x="308" y="182" font-size="11" text-anchor="middle">delete (latest)</text>
    <text class="code" x="308" y="199" font-size="11" text-anchor="middle">deleteVersions</text>

    <!-- undelete -->
    <path d="M380 246 H244" stroke="#6366f1" stroke-width="2" marker-end="url(#vt-life-keep)"/>
    <rect class="chip" x="250" y="234" width="124" height="24" rx="12"/>
    <text class="code" x="312" y="250" font-size="11" text-anchor="middle">undeleteVersions</text>

    <!-- state: soft deleted -->
    <rect class="card" x="380" y="152" width="200" height="120" rx="12" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="title" x="398" y="178">Soft deleted</text>
    <text class="code" x="398" y="202" font-size="12">getOne → 404</text>
    <text class="code muted" x="398" y="222" font-size="12">deletion_time set</text>
    <text class="muted" x="398" y="246" font-size="12">The data is kept and</text>
    <text class="muted" x="398" y="262" font-size="12">can be restored.</text>

    <!-- destroy from soft deleted -->
    <path d="M580 212 H716" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>
    <rect class="chip" x="588" y="200" width="120" height="24" rx="12"/>
    <text class="code" x="648" y="216" font-size="11" text-anchor="middle">destroyVersions</text>

    <!-- state: destroyed -->
    <rect class="card" x="720" y="152" width="200" height="120" rx="12" stroke="#d946ef" stroke-width="1.5"/>
    <text class="title" x="738" y="178">Destroyed</text>
    <text class="code" x="738" y="202" font-size="12">getOne → 404</text>
    <text class="code muted" x="738" y="222" font-size="12">destroyed: true</text>
    <text class="muted" x="738" y="246" font-size="12">The data is gone, the</text>
    <text class="muted" x="738" y="262" font-size="12">version metadata stays.</text>

    <!-- deleteMetadata from any state -->
    <path d="M140 272 V328" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>
    <path d="M480 272 V328" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>
    <path d="M820 272 V328" stroke="#d946ef" stroke-width="2" marker-end="url(#vt-life-drop)"/>

    <rect class="card" x="40" y="332" width="880" height="56" rx="12" stroke="#d946ef" stroke-width="1.5"/>
    <text class="code" x="58" y="356" font-size="13" font-weight="600">deleteMetadata</text>
    <text x="58" y="376" font-size="12">Removes the metadata and every version of the secret, whatever its state. Neither this nor destroyVersions can be undone.</text>
</svg>
